<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking DO - Interaktif</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <style>
        .fade-enter-active, .fade-leave-active { transition: opacity 0.5s; }
        .fade-enter, .fade-leave-to { opacity: 0; }
    </style>
</head>
<body>
    <div class="container" id="tracking-app">
        <header>
            <h1>Tracking & Input Delivery Order (DO)</h1>
            <nav><a href="index.html">⬅ Kembali ke Home</a></nav>
        </header>

        <div class="form-section">
            <h3 style="margin-top: 0;">📦 Buat Delivery Order Baru</h3>
            <form @submit.prevent="submitDO">
                <div style="background: var(--light-blue); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                    <span style="font-size: 1.2rem;"><strong>Nomor DO (Otomatis):</strong> <span style="color: var(--primary-blue);">{{ generatedDO }}</span></span>
                </div>

                <div class="filter-grid">
                    <div class="form-group">
                        <label>NIM Mahasiswa</label>
                        <input type="text" v-model="formDO.nim" placeholder="Masukkan NIM" required>
                    </div>
                    <div class="form-group">
                        <label>Nama Lengkap</label>
                        <input type="text" v-model="formDO.nama" placeholder="Masukkan Nama" required>
                    </div>
                    <div class="form-group">
                        <label>Pilih Ekspedisi</label>
                        <select v-model="formDO.ekspedisi" required>
                            <option value="">-- Pilih Ekspedisi --</option>
                            <option v-for="eks in pengirimanList" :value="eks.kode">{{ eks.nama }}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Pilih Paket Bahan Ajar</label>
                        <select v-model="formDO.paket" required>
                            <option value="">-- Pilih Paket --</option>
                            <option v-for="pkt in paket" :value="pkt.kode">{{ pkt.kode }} - {{ pkt.nama }}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tanggal Kirim</label>
                        <input type="date" v-model="formDO.tanggalKirim" required>
                    </div>
                </div>

                <transition name="fade">
                    <div v-if="detailPaketTerpilih" style="background: #fff3cd; padding: 15px; border-radius: 8px; margin-top: 20px; border-left: 5px solid var(--primary-yellow);">
                        <h4 style="margin-top: 0;">Rincian Paket Terpilih:</h4>
                        <ul style="margin: 5px 0;">
                            <li v-for="isi in detailPaketTerpilih.isi">{{ isi }}</li>
                        </ul>
                        <strong style="font-size: 1.1rem;">Total Harga: Rp {{ detailPaketTerpilih.harga.toLocaleString('id-ID') }}</strong>
                    </div>
                </transition>

                <div style="margin-top: 20px;">
                    <button type="submit" class="btn">🚀 Buat Delivery Order</button>
                </div>
            </form>
        </div>

        <transition name="fade">
            <div v-if="successMsg" style="background: #d4edda; border-left: 5px solid #28a745; padding: 15px; color: #155724; margin-top: 20px; border-radius: 8px; font-weight: bold;">
                ✔ {{ successMsg }}
            </div>
        </transition>
    </div>
    <script src="js/tracking-app.js"></script>
</body>
</html>
